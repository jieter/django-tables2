name: CI
on: [push, pull_request]
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/checkout@v7
      - run: pip install pre-commit
      - run: pre-commit run --show-diff-on-failure --all-files

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12, 3.13, 3.14]
        django-version: [5.2, 6.0, 6.1, "main"]
        exclude:
            # Django 6.0
            - python-version: 3.11
              django-version: 6.0

            # Django 6.1
            - python-version: 3.11
              django-version: 6.1

            # Django main
            - python-version: 3.11
              django-version: "main"

    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/checkout@v7
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install Django ${{ matrix.django-version }}
        run: python -m pip install Django==${{ matrix.django-version }}
        if: ${{ matrix.django-version != 'main' }}
      - name: Install Django main branch
        run: python -m pip install -U https://github.com/django/django/archive/master.tar.gz
        if: matrix.django-version == 'main'
      - run: |
          python -m pip install coverage
          python -m pip install -r requirements/common.pip
      - run: coverage run --source=django_tables2 manage.py test

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
            python-version: "3.11"
            cache: 'pip'
            cache-dependency-path: |
              docs/requirements.txt
              common/requirements.txt
      - name: Install and build
        run: |
          cd docs
          python -m pip install -r requirements.txt
          make html
